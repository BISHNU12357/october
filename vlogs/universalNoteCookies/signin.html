<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign in</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        const signIn = async() => { 
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const response = await axios.post("http://127.0.0.1:3000/login", {
                username: username, 
                password: password
            }, { withCredentials: true })
            if(response.data.success){
                window.location.href = "landingPage.html";
                alert("you are logged in")
            }else{
                alert(response.data.message)
            }
        }
        const redirect = () => {
            window.location.href = "signup.html"
        }
    </script>
</head>
<body>
    <div>
        <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; width: 500px; height: 300px;background-color: greenyellow; margin-top: 20%; margin-left: 35%; ">
            <input id="username" type="text" placeholder="Enter your username"><br>
            <input id="password" type="password" placeholder="Enter your password"><br>
            <button style="border-radius: 5px;" id="sub" onclick="signIn()">sign in</button> <button onclick="redirect()">Don't have a account?</button>
        </div>
    </div>
</body>
</html>
